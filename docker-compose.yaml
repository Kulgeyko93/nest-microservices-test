version: "3.7"
services:
  postgres:
    container_name: postgres-db
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: "account"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
      PGDATA: "/var/lib/postgresql/data/pgdata"   
    ports:
      - 5444:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d account"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./volumes/postgres_init:/docker-entrypoint-initdb.d
      - ./volumes/postgres_data:/var/lib/postgresql/data

